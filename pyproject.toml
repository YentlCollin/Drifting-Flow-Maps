[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drifting-flow-maps"
version = "0.1.0"
description = "Self-induced flow maps via kernel-WGF and feature-space drifting"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "torch>=2.9", "torchvision>=0.24", "numpy>=2", "matplotlib>=3.10",
  "pillow>=10", "scipy>=1.15", "tqdm>=4.67",
  "denoising-diffusion-pytorch==2.2.6", "diffusers>=0.35", "pytorch-fid>=0.3",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["."]
include = ["flowmaps*", "examples*"]
namespaces = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
